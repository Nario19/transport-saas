<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flota+ Conductor</title>
    <meta http-equiv="refresh" content="0; url=https://www.transjunin.com" />
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0f172a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        .logo-img {
            max-width: 220px;
            height: auto;
            max-height: 70px;
            margin-bottom: 24px;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3));
        }
        .loader {
            width: 40px;
            height: 40px;
            border: 3.5px solid rgba(255, 255, 255, 0.15);
            border-top: 3.5px solid #10b981;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin: 0 auto 16px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div>
        <img src="images/logoconletra.png" alt="Flota+" class="logo-img" onerror="this.style.display='none'">
        <div class="loader"></div>
        <p style="margin: 0; font-size: 13px; opacity: 0.8; font-weight: 600; letter-spacing: 0.3px;">Conectando con el sistema...</p>
    </div>
    <script>
        window.location.replace("https://www.transjunin.com");
    </script>
</body>
</html>
